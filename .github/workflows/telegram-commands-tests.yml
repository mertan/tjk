name: Telegram command tests

on:
  pull_request:
    paths:
      - 'tools/telegram-commands/**'
      - '.github/workflows/telegram-commands-tests.yml'
  push:
    paths:
      - 'tools/telegram-commands/**'
      - '.github/workflows/telegram-commands-tests.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit tests
        env:
          PYTHONPATH: tools/telegram-commands
        run: python -m unittest discover -s tools/telegram-commands/tests -v
