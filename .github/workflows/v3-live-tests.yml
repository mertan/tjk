name: V3 live integration tests
on:
  pull_request:
    branches: [devin/1791621641-tjk-v3-value]
  push:
    branches: [codex/tjk-v3-live-4200-20261010]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node --check public/app.js && node --check public/sw.js
