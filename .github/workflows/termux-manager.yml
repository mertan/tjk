name: Termux management API

on:
  push:
    paths:
      - 'tools/termux-manager/**'
      - '.github/workflows/termux-manager.yml'
  pull_request:
    paths:
      - 'tools/termux-manager/**'
      - '.github/workflows/termux-manager.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Synthetic risk, protocol, confinement and installation tests
        working-directory: tools/termux-manager
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          ALPACA_API_KEY_ID: ''
          ALPACA_API_SECRET_KEY: ''
        run: python3 -B -m unittest discover -s tests -v
