name: TJK regression tests
on:
  pull_request:
    # Include stacked PR targets.
  push:
    branches: [main, "codex/**", "devin/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node --check public/app.js && node --check public/sw.js
